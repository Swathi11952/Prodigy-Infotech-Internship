<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prodigy Infotech Internship</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #005b96;
            color: #222;
        }

        header {
            text-align: center;
            padding: 50px 20px 20px;
            color: white;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
        }

        .tasks-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .task-card {
            background: white;
            padding: 35px 25px;
            border-radius: 15px;
            text-align: center;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .task-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .task-card h2 {
            margin-bottom: 15px;
            font-size: 25px;
        }

        .task-card p {
            margin-bottom: 25px;
            color: #555;
            font-size: 16px;
        }

        .task-card a {
            display: inline-block;
            text-decoration: none;

            background: #0077b6;
            color: white;

            padding: 12px 25px;
            border-radius: 7px;

            font-weight: bold;
        }

        .task-card a:hover {
            background: #023e8a;
        }

        footer {
            text-align: center;
            color: white;
            padding: 30px 20px;
            font-size: 16px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 30px;
            }

            header p {
                font-size: 15px;
            }

            .tasks-container {
                grid-template-columns: 1fr;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Prodigy Infotech Internship</h1>
        <p>Web Development Internship – Task Portfolio</p>
    </header>


    <div class="tasks-container">

        <!-- Task 1 -->
        <div class="task-card">
            <h2>Task 1</h2>

            <p>
                Responsive Landing Page
            </p>

            <a href="Task-1/task1.html">
                View Task
            </a>
        </div>


        <!-- Task 2 -->
        <div class="task-card">
            <h2>Task 2</h2>

            <p>
                Stopwatch Web Application
            </p>

            <a href="Task-2/task2.html">
                View Task
            </a>
        </div>


        <!-- Task 3 -->
        <div class="task-card">
            <h2>Task 3</h2>

            <p>
                Tic Tac Toe Game
            </p>

            <a href="Task-3/task3.html">
                View Task
            </a>
        </div>


        <!-- Task 4 -->
        <div class="task-card">
            <h2>Task 4</h2>

            <p>
                Personal Portfolio
            </p>

            <a href="Task-4/task4.html">
                View Task
            </a>
        </div>


        <!-- Task 5 -->
        <div class="task-card">
            <h2>Task 5</h2>

            <p>
                Weather App
            </p>

            <a href="Task-5/task5.html">
                View Task
            </a>
        </div>

    </div>


    <footer>
        <p>Developed by Swathi S</p>
    </footer>

</body>

</html>
